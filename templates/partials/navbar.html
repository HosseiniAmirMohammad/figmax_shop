<!-- templates/partials/navbar.html -->
{% load static %}

<nav class="navbar">
    <div class="nav-container">
        <div class="nav-row nav-row-top">
            <!--LOGO-->
            <a href="/" class="logo-link">
                <img src="{% static 'images/logo-white.png' %}" alt="FIGMAX Logo" class="logo-img logo-white" />
                <img src="{% static 'images/logo-red.png' %}" alt="FIGMAX Logo" class="logo-img logo-red" />
            </a>
            
            <!-- دکمه همبرگری (فقط موبایل) -->
            <button class="nav-toggle" id="navToggle" aria-label="منو">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <!-- سبد خرید و دکمه‌های کاربری (دسکتاپ و موبایل) -->
            <div class="nav-actions">
                <a href="{% url 'shop:cart' %}" class="cart-link">
                    🛒
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}" class="nav-link">پنل کاربری</a>
                    {% if user.is_superuser %}
                        <a href="{% url 'shop:admin_dashboard' %}" class="nav-link admin-link">پنل مدیریت</a>
                    {% endif %}
                    <a href="{% url 'accounts:logout' %}" class="nav-link logout-link">خروج</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="nav-link">ورود</a>
                    <a href="{% url 'accounts:register' %}" class="nav-link register-link">ثبت‌نام</a>
                {% endif %}
            </div>
        </div>
        
        <!-- منوی پایین (فقط دسکتاپ) -->
        <div class="nav-row nav-row-bottom" id="navMenu">
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">خانه</a></li>
                <li><a href="{% url 'shop:product_list' %}" class="nav-link">محصولات</a></li>
                <li><a href="{% url 'shop:about' %}" class="nav-link">درباره ما</a></li>
            </ul>
        </div>
    </div>
</nav>

<script>
    // منوی همبرگری
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('navToggle');
        const menu = document.getElementById('navMenu');
        
        if (toggle && menu) {
            toggle.addEventListener('click', function() {
                this.classList.toggle('active');
                menu.classList.toggle('open');
            });
            
            menu.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    toggle.classList.remove('active');
                    menu.classList.remove('open');
                });
            });
        }
    });
</script>
